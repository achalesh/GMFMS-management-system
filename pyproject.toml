[project]
name = "gmfms"
version = "0.1.0"
description = "Gramaswaraj Media Facilitator Management System"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "**/migrations/*", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

